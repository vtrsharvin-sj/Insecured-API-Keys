# Insecured API Keys UI: static Next.js export + API reverse proxy on one origin.
# Configure any public domain in ALLOWED_REFERRERS (see .env.example) if needed.
# Same-origin requests are always accepted by the API.

# websocket upgrade support (SignalR)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (applied to every response) ──────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "geolocation=(), microphone=()"       always;
    # Enable HSTS only when you have TLS in front of this container.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/x-font-ttf font/opentype;

    # ── API proxy + SignalR websocket ─────────────────────────────────────
    location /apiproxy/ {
        # Handle CORS preflight for POST/PUT from browser
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $http_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Referer';
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }

        proxy_pass         http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      $connection_upgrade;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # ── Static Next.js export ─────────────────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ── Long-lived cache for hashed _next/static assets ──────────────────
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
