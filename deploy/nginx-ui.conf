# Insecured API Keys UI: static Next.js export + API reverse proxy on one origin.
# Configure any public domain in ALLOWED_REFERRERS (see .env.example) if needed -
# same-origin requests are always accepted by the API.

# websocket upgrade support (SignalR)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API (and the /hubs/stats SignalR websocket) on the same origin
    # CORS preflight for POST endpoints from browser
    location /apiproxy/ {
        # Handle OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Referer';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;

        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
