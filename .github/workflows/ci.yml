name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build .NET backend (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build UnsecuredAPIKeys.sln -c Release -warnaserror --nologo

      - name: Publish WebAPI artifact
        run: dotnet publish UnsecuredAPIKeys.WebAPI/UnsecuredAPIKeys.WebAPI.csproj -c Release -o publish/api /p:UseAppHost=false

      - uses: actions/upload-artifact@v4
        with:
          name: webapi
          path: publish/api/

  ui:
    name: Build UI (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnsecuredAPIKeys.UI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UnsecuredAPIKeys.UI/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build:simple
